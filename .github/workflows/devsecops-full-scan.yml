name: DevSecOps Full Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"

jobs:
  secrets-detection:
    name: Secrets Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  iac-security:
    name: IaC Security (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform,kubernetes,dockerfile
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov.sarif

  opa-policy-tests:
    name: OPA Policy Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - name: Run OPA tests
        run: opa test policies/ -v --format pretty

  pre-commit-check:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  security-summary:
    name: Security Gate Summary
    runs-on: ubuntu-latest
    needs: [secrets-detection, iac-security, opa-policy-tests]
    if: always()
    steps:
      - name: Check all security gates
        run: |
          echo "=== DevSecOps Pipeline Results ==="
          echo "Secrets Detection : ${{ needs.secrets-detection.result }}"
          echo "IaC Security      : ${{ needs.iac-security.result }}"
          echo "OPA Policy Tests  : ${{ needs.opa-policy-tests.result }}"
          if [[ "${{ needs.secrets-detection.result }}" == "failure" ]]; then
            echo "BLOCKED: Secrets detected in codebase"
            exit 1
          fi
