name: DevSecOps Full Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

jobs:
  secrets-detection:
    name: Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  iac-security:
    name: IaC Security (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform,kubernetes,dockerfile
          soft_fail: true

  opa-policy-tests:
    name: OPA Policy Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - name: Run OPA policy unit tests
        run: |
          echo "Running OPA tests..."
          opa test policies/ -v --format pretty
          echo "All OPA tests passed"

  security-summary:
    name: Security Gate Summary
    runs-on: ubuntu-latest
    needs: [secrets-detection, iac-security, opa-policy-tests]
    if: always()
    steps:
      - name: Report results
        run: |
          echo "=============================="
          echo "DevSecOps Pipeline Results"
          echo "=============================="
          echo "Secrets Detection : ${{ needs.secrets-detection.result }}"
          echo "IaC Security      : ${{ needs.iac-security.result }}"
          echo "OPA Policy Tests  : ${{ needs.opa-policy-tests.result }}"
          echo "=============================="
